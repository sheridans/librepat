[workspace]
members = [
    "librepat-app",
    "librepat-core",
    "librepat-fluke",
    "librepat-import",
    "librepat-kewtech",
    "librepat-report",
    "librepat-seaward",
    "librepat-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
repository = "https://github.com/librepat/librepat"

[workspace.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow", "links", "wayland", "x11"] }
printpdf = { version = "0.12.6", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
redundant_clone = "warn"
unwrap_used = "deny"
